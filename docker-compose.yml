services:
  mysql:
    image: mysql:8.0
    container_name: eventhub_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_eventhub_pass
      MYSQL_DATABASE: eventhub_db
      MYSQL_USER: eventhub_user
      MYSQL_PASSWORD: eventhub_pass
    ports:
      - "3307:3306"
    volumes:
      - eventhub_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_eventhub_pass"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  eventhub_mysql_data:
